
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: API1_URL
              value: "http://api1-service/greet"
            - name: API2_URL
              value: "http://api2-service/info"
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"
