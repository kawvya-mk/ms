
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api2
  template:
    metadata:
      labels:
        app: api2
    spec:
      containers:
        - name: api2
          image: api2:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api2-service
spec:
  type: ClusterIP
  selector:
    app: api2
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
